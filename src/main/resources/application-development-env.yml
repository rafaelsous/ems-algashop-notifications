spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/notifications/database?prefix=notifications.secrets.datasource.
      - aws-parameterstore:/config/algashop/notifications?prefix=notifications.params
      - aws-secretsmanager:/secret/algashop/notifications/database?prefix=notifications.secrets
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566

  datasource:
    url: ${notifications.params.datasource.url}
    username: ${notifications.secrets.datasource.username}
    password: ${notifications.secrets.datasource.password}

  jpa:
    show-sql: ${notifications.params.jpa.show-sql}

  flyway:
    locations: classpath:db/migration,classpath:db/testdata

  mail:
    host: ${notifications.params.mail.host}
    port: ${notifications.params.mail.port}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url}

algashop:
  notifications:
    mail:
      from: ${notifications.params.mail.from}

eureka:
  client:
    service-url:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: false
  instance:
    instance-id: ${random.uuid}
    prefer-ip-address: true