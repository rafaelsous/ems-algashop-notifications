spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/notifications/database?prefix=notifications.secrets.datasource.
      - aws-parameterstore:/config/algashop/notifications?prefix=notifications.params
      - aws-secretsmanager:/secret/algashop/notifications/database?prefix=notifications.secrets
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566

  datasource:
    url: ${notifications.params.datasource.url}
    username: ${notifications.secrets.datasource.username}
    password: ${notifications.secrets.datasource.password}

  jpa:
    show-sql: ${notifications.params.jpa.show-sql}

  flyway:
    locations: classpath:db/migration,classpath:db/testdata

  mail:
    host: ${notifications.params.mail.host}
    port: ${notifications.params.mail.port}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url}

  kafka:
    bootstrap-servers: algashop-kafka-1:9092,algashop-kafka-2:9093,algashop-kafka-3:9094
    properties:
      spring.json.type.mapping:
        Notifications.SendEmailCommand:com.algaworks.algashop.notifications.application.email.command.SendEmailIntegrationCommand
    admin:
      fail-fast: true
      auto-create: true
      modify-topic-configs: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 30000
        max.block.ms: 5000

    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.algaworks.algashop.*
        spring.json.key.default.type: java.lang.String
        spring.json.value.default.type: java.lang.String
        spring.json.value.type.method: com.algaworks.algashop.notifications.infrastructure.kafka.KafkaConsumerTypeIdIdentifier.readType

algashop:
  notifications:
    mail:
      from: ${notifications.params.mail.from}

eureka:
  client:
    service-url:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: false
  instance:
    instance-id: ${random.uuid}
    prefer-ip-address: true